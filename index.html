<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>5.000秒チャレンジ</title>
<style>
  :root { --bg:#0b0b0f; --panel:#15151c; --text:#f7f7fb; --muted:#9b9baa; --line:#2a2a35; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  body { display:flex; align-items:center; justify-content:center; padding:22px; min-height:100dvh; }
  .wrap { width:min(520px,100%); text-align:center; }
  .eyebrow { color:var(--muted); font-size:13px; letter-spacing:.16em; margin-bottom:10px; }
  h1 { font-size:clamp(30px,8vw,48px); margin:0 0 8px; line-height:1.05; }
  .sub { color:var(--muted); margin:0 0 28px; font-size:15px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:26px; padding:28px 20px 22px; box-shadow:0 16px 50px rgba(0,0,0,.28); }
  .timer { font-variant-numeric:tabular-nums; font-size:clamp(56px,16vw,88px); font-weight:800; letter-spacing:-.05em; margin:8px 0 22px; }
  .hint { min-height:24px; color:var(--muted); font-size:14px; margin-bottom:18px; }
  button { width:100%; border:0; border-radius:18px; padding:18px 16px; font-size:20px; font-weight:800; cursor:pointer; background:#f4f4f8; color:#111118; }
  button:active { transform:scale(.985); }
  .share-primary { margin-top:18px; background:#f4f4f8; color:#111118; font-size:17px; padding:15px; }
  .secondary { margin-top:10px; background:transparent; color:var(--text); border:1px solid var(--line); font-size:15px; padding:14px; }
  .result { margin-top:20px; display:none; }
  .big { font-size:24px; font-weight:800; margin-bottom:6px; }
  .delta { color:var(--muted); font-variant-numeric:tabular-nums; }
  .comment { margin:14px auto 0; min-height:52px; max-width:390px; font-size:18px; line-height:1.45; font-weight:700; }
  .best { margin-top:14px; color:var(--muted); font-size:13px; }
  .footer { margin-top:16px; color:#666673; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">MINI GAME #001</div>
  <h1>5.000秒チャレンジ</h1>
  <p class="sub">途中でタイマーが消えます。体内時計だけで5秒を狙ってください。</p>

  <div class="card">
    <div id="timer" class="timer">0.000</div>
    <div id="hint" class="hint">STARTを押した瞬間に計測開始</div>
    <button id="mainBtn">START</button>

    <div id="result" class="result">
      <div id="grade" class="big"></div>
      <div id="delta" class="delta"></div>
      <div id="comment" class="comment"></div>
      <button id="xShareBtn" class="share-primary">Xで結果をシェア</button>
      <button id="nativeShareBtn" class="secondary">共有する</button>
      <button id="copyBtn" class="secondary">結果をコピー</button>
    </div>
    <div id="best" class="best"></div>
  </div>

  <div class="footer">あなたの「5秒」は何秒？</div>
</div>

<script>
(() => {
  const timer = document.getElementById('timer');
  const mainBtn = document.getElementById('mainBtn');
  const hint = document.getElementById('hint');
  const result = document.getElementById('result');
  const grade = document.getElementById('grade');
  const delta = document.getElementById('delta');
  const comment = document.getElementById('comment');
  const bestEl = document.getElementById('best');
  const xShareBtn = document.getElementById('xShareBtn');
  const nativeShareBtn = document.getElementById('nativeShareBtn');
  const copyBtn = document.getElementById('copyBtn');

  let running = false;
  let startTime = 0;
  let raf = 0;
  let last = 0;
  let best = Number(localStorage.getItem('fiveSecBest') || Infinity);

  const showBest = () => {
    bestEl.textContent = Number.isFinite(best)
      ? `BEST: ${best.toFixed(3)} 秒（誤差 ${Math.abs(best - 5).toFixed(3)} 秒）`
      : '';
  };
  showBest();

  function draw(now) {
    if (!running) return;
    last = (now - startTime) / 1000;
    timer.textContent = last < 1.5 ? last.toFixed(3) : "?.???";
    raf = requestAnimationFrame(draw);
  }

  function pick(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  function getReaction(elapsed) {
    const err = Math.abs(elapsed - 5);
    const early = elapsed < 5;

    if (err <= 0.001) return {
      grade: '5.000!?!?!',
      comment: pick([
        '5秒のほうがあなたに合わせに来た。',
        '人間のふりをした原子時計。',
        'これは記録というより事件。'
      ])
    };
    if (err <= 0.005) return {
      grade: '人間やめてる',
      comment: pick([
        'その体内時計、どこで校正した？',
        'ほぼ時報。怖い。',
        '誤差という言葉に失礼なレベル。'
      ])
    };
    if (err <= 0.020) return {
      grade: 'ほぼ原子時計',
      comment: pick([
        'ここまで来ると「惜しい」より「怖い」。',
        '体内時計、電波受信してる？',
        '5秒をかなり飼い慣らしてる。'
      ])
    };
    if (err <= 0.050) return {
      grade: '普通に強い',
      comment: pick([
        '「たまたま」で片づけるには上手すぎる。',
        '5秒の輪郭が見えてる。',
        'これはちょっと自慢していい。'
      ])
    };
    if (err <= 0.100) return {
      grade: 'かなり惜しい',
      comment: pick([
        'あと一歩で時報側の人間。',
        '5秒とはかなり仲がいい。',
        '悔しくてもう一回やるには絶妙な距離。'
      ])
    };
    if (err <= 0.250) return {
      grade: 'なかなか',
      comment: pick([
        '人間としてはかなり正確。',
        '時計なしなら十分すぎる。',
        '地味にうまい。地味に悔しい。'
      ])
    };
    if (err <= 0.500) return {
      grade: '惜しい…のか？',
      comment: pick([
        '5秒とは面識がある。',
        '体内時計、今日はちょっと寝坊。',
        '惜しいと言えば惜しい。言わなければ普通。'
      ])
    };
    if (err <= 1.000) return {
      grade: early ? 'ちょっとせっかち' : 'ちょっと慎重',
      comment: early
        ? pick([
            '5秒待てない性格が数字に出てる。',
            'STOPへの気持ちが前のめり。',
            '体内時計までせっかち。'
          ])
        : pick([
            '止める決断にも熟考するタイプ。',
            '慎重さが秒数にまで出てる。',
            '5秒を少し名残惜しんだらしい。'
          ])
    };
    if (err <= 2.000) return {
      grade: '時差あり',
      comment: pick([
        'あなたの体内だけ別のタイムゾーン。',
        '5秒って思ってたより長いらしい。',
        '秒より雰囲気で時間を測ってる。'
      ])
    };
    return {
      grade: '自由',
      comment: pick([
        '5秒という概念から解放されてる。',
        'もはや別の時間軸で生きてる。',
        'ここまで来ると時計側を疑いたい。'
      ])
    };
  }

  mainBtn.addEventListener('click', () => {
    if (!running) {
      running = true;
      result.style.display = 'none';
      timer.textContent = '0.000';
      hint.textContent = '1.5秒後に表示が消えます';
      mainBtn.textContent = 'STOP';
      startTime = performance.now();
      raf = requestAnimationFrame(draw);
    } else {
      running = false;
      cancelAnimationFrame(raf);
      const elapsed = (performance.now() - startTime) / 1000;
      last = elapsed;
      timer.textContent = elapsed.toFixed(3);
      const err = Math.abs(elapsed - 5);
      const reaction = getReaction(elapsed);
      grade.textContent = reaction.grade;
      comment.textContent = reaction.comment;
      comment.dataset.shareComment = reaction.comment;
      delta.textContent = `誤差 ${err.toFixed(3)} 秒`;
      result.style.display = 'block';
      mainBtn.textContent = 'もう一回';
      hint.textContent = elapsed === 5 ? 'ぴったり！' : (elapsed < 5 ? '少し早かった' : '少し遅かった');

      if (!Number.isFinite(best) || err < Math.abs(best - 5)) {
        best = elapsed;
        localStorage.setItem('fiveSecBest', String(best));
        showBest();
      }
    }
  });

  function shareText() {
    const err = Math.abs(last - 5);
    const reactionText = comment.dataset.shareComment || '';
    return `5.000秒チャレンジ：${last.toFixed(3)}秒
誤差 ${err.toFixed(3)}秒
「${reactionText}」

あなたの体内時計は何秒？`;
  }

  xShareBtn.addEventListener('click', () => {
    const text = encodeURIComponent(shareText());
    const url = encodeURIComponent(window.location.href);
    window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank', 'noopener,noreferrer');
  });

  nativeShareBtn.addEventListener('click', async () => {
    const data = {
      title: '5.000秒チャレンジ',
      text: shareText(),
      url: window.location.href
    };
    if (navigator.share) {
      try {
        await navigator.share(data);
      } catch (e) {
        // User cancelled or sharing failed: do nothing.
      }
    } else {
      try {
        await navigator.clipboard.writeText(`${data.text}\n${data.url}`);
        nativeShareBtn.textContent = 'コピーしました';
        setTimeout(() => nativeShareBtn.textContent = '共有する', 1200);
      } catch {
        prompt('コピーしてください', `${data.text}\n${data.url}`);
      }
    }
  });

  copyBtn.addEventListener('click', async () => {
    const text = `${shareText()}\n${window.location.href}`;
    try {
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = 'コピーしました';
      setTimeout(() => copyBtn.textContent = '結果をコピー', 1200);
    } catch {
      prompt('コピーしてください', text);
    }
  });
})();
</script>
</body>
</html>
